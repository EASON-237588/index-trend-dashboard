<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&text=0123456789%2B%E2%88%92.,&display=swap">
<link rel="icon"href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e14'/%3E%3Cpath d='M8 46 L22 34 L32 40 L46 20 L56 26' fill='none' stroke='%23ff3b3b' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0e14; --panel:#131722; --line:#232838; --text:#d6dbe6; --mute:#8b93a7; --dim:#5d6578;
  --long:#ff3b3b; --short:#4cff00; --flat:#7a8494; --tag:#22c7e8; --warn:#ffb020;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
/* v1.0.1 起整頁是手機直式版面：三格上下等分、塞滿一個畫面、不捲動。桌機也是同樣的窄版置中。 */
/* 用 fixed＋inset:0 釘滿整個螢幕，不用 100dvh：iPhone 加到主畫面時 100dvh 會少算，
   v1.0.2 底部空了一大塊。底部只留手勢條高度的三分之一，圖延伸到手勢條底下沒關係。 */
.app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) / 3)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px 5px}
h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
/* v1.4.4：版本號霓光紅（只換顏色、不加光暈） */
h1 small{font-size:11px;color:#ff2d55;font-weight:400;margin-left:5px}
/* v1.3.0：四格擠在一頁太小，分成「短趨勢」「中長趨勢」兩頁，各兩格，用版本號旁的按鈕切換 */
.tabs{flex:none;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{font-size:12px;color:var(--mute);background:var(--panel);border:0;padding:3px 9px;cursor:pointer;white-space:nowrap}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{color:#0b0e14;background:var(--tag);font-weight:700}
/* v1.4.1 多了「曲線圖」按鈕，手機寬度下標題列會超出 53px、「說明」被擠出畫面：窄螢幕縮間距與內距 */
@media (max-width:440px){
  header{gap:3px;padding-left:4px;padding-right:4px}
  h1{letter-spacing:0}
  .tabs button{padding:3px 6px}
  header .hbtn{padding:3px 6px}
  header .hbtn+.hbtn{margin-left:0}
  /* v1.11.0 多了「台指」分頁，375 寬時標題列寬 421、交易明細被擠出畫面：字與內距再縮 */
  header{gap:2px}
  h1{font-size:14px}
  h1 small{font-size:10px;margin-left:3px}
  .tabs button{padding:3px 4px;font-size:11.5px}
  header .hbtn{padding:3px 5px;font-size:11.5px}
}

.dot.live{background:#2ecc71;animation:blink 1.2s ease-in-out infinite}

/* v1.4.2：狀態只留燈號（連線正常綠燈閃爍），文字不顯示，改成燈號的提示文字 */
#stTxt{display:none}
.status{flex:none;margin-left:auto}
/* v1.4.3：曲線圖緊貼在中長趨勢右邊，燈號靠最右 */

.hbtn+.hbtn{margin-left:6px}

/* v1.8.4：六格改叫 A～F（照畫面順序），標籤黃字（使用者 2026-10-13 要求） */

.flt{flex:none;margin-left:auto;background:#fff;border-radius:4px;padding:0 7px;font-size:13px;font-weight:900;line-height:17px;color:#555;

.cw{position:relative;flex:1;min-height:0;border-radius:5px;overflow:hidden;background:#0e121b}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:crosshair}
.zoom{position:absolute;left:5px;top:5px;display:flex;gap:3px}

.wait[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-end}

.sheet .in{width:100%;max-width:560px;max-height:85dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);

/* v1.7.0 交易明細 */
.tk{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 8px}
.tk button{font-size:12px;color:var(--mute);background:#0e121b;border:1px solid var(--line);border-radius:5px;padding:2px 9px;cursor:pointer}
.tk button.on{color:#0b0e14;background:var(--tag);border-color:var(--tag);font-weight:700}
/* v1.16.3（使用者 2026-10-18 要求）：交易明細的 B2 與台指 A/B 黃底深字並閃爍。
   白字在黃底上對比太低，改用選中樣式同一個深色 #0b0e14。
   寫在 .on 後面，選中與否都維持黃底深字；閃爍只動透明度，不加光暈。 */
.tk button[data-blink]{color:#0b0e14;background:#ffd400;border-color:#ffd400;font-weight:700;animation:blinkName 1.2s ease-in-out infinite}
/* v1.16.4（使用者 2026-10-18 要求）：交易明細每組最上面列出週期、策略參數、資料源，紅底白字。
   來源是 PANELS 每格的 spec，跟格子本身同一份定義，不另抄一份以免兩邊走樣。 */
.spec{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}

.spec span i{font-style:normal;font-weight:400;opacity:.8;margin-right:5px}
.tsum{color:var(--text);font-size:12px;line-height:1.6;margin-bottom:4px;font-variant-numeric:tabular-nums}
.tsum .tot{font-size:24px;font-weight:700;line-height:1.35}   /* v1.7.1 使用者要求合計加大 1.5 倍（16→24） */
.tnote{font-size:11px;color:var(--mute);line-height:1.5;margin:2px 0 6px}
.tnote.warn{color:var(--warn)}
.tt{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.35;color:var(--text);font-variant-numeric:tabular-nums}
.tt th{font-weight:400;color:var(--mute);text-align:right;padding:3px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{text-align:right;padding:4px 3px;border-bottom:1px solid #1b2130;white-space:nowrap;vertical-align:top}
.tt th:nth-child(-n+2),.tt td:nth-child(-n+2){text-align:center}
.tt small{color:var(--mute);font-size:10.5px}
.tt tr.live td:first-child{color:var(--tag)}
.tt tr.hold td{background:rgba(34,199,232,.07)}
/* v1.20.0 績效表（使用者 2026-10-21 要求）：手機欄位放不下，整張表可左右滑；組別、備註兩欄允許換行 */
.stw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}
.st th:first-child,.st td:first-child{text-align:left;white-space:normal;min-width:118px}
.st td.nt{text-align:left;white-space:normal;min-width:150px}
.st th:last-child{text-align:left}
.st tr.pass td{background:rgba(255,212,0,.08)}
.st tr.pass td.nt{color:#ffd400;font-weight:700}
.st tr.wait td{color:var(--mute)}
.st .sec td{color:var(--mute);text-align:left;padding-top:8px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>期貨趨勢<small id="ver"></small></h1>
  <div class="tabs" id="tabs"><button data-pg="short">短趨勢</button><button data-pg="tx">台指</button><button data-pg="long">趨勢</button><button data-pg="obs">觀察</button><button data-pg="obs2">觀察二</button></div>
  <!-- v1.20.1 使用者 2026-10-21 要求標題列文字縮短：中長趨勢→趨勢、交易明細→明細（面板內標籤與明細視窗標題不變） -->
  <button class="hbtn" id="tradeBtn">明細</button>
  <div class="status"><i class="dot" id="dot"></i><span id="stTxt">準備中</span></div>
</header>
<div class="loadbar" id="loadBar" hidden><div class="fill" id="loadFill"></div><span id="loadTxt"></span></div>
<main class="grid" id="grid"></main>
</div>

<!-- v1.7.0：曲線圖改成交易明細（使用者 2026-10-13 要求），開著時每秒更新 -->
<div class="sheet" id="tradeSheet" hidden>
  <div class="in">
    <div class="top">明細<button class="hbtn" id="tradeClose">關閉</button></div>
    <div class="tk" id="tradeTabs"></div>
    <div id="tradeBody"></div>
  </div>
</div>

<!-- v1.4.2：使用者要求拿掉「說明」視窗；換算比文字仍由程式寫入，留隱藏欄位避免出錯 -->
<div id="ratioTxt" hidden></div>

<script>
"use strict";
const VERSION = "v1.20.2";   // v1.20.2：明細視窗標題「交易明細」→「明細」；v1.20.1：標題列「中長趨勢」→「趨勢」、「交易明細」→「明細」；v1.20.0：交易明細加「績效表」分頁
const $ = id => document.getElementById(id);
const FAPI = "https://fapi.binance.com/fapi/v1";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const p2 = n => String(n).padStart(2, "0");
function tText(ms){ const d = new Date(ms); return `${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function hm(ms){ const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function durText(ms){
  const m = Math.max(0, Math.floor(ms/60000));
  if(m < 60) return `${m} 分`;
  const h = Math.floor(m/60);
  if(h < 48) return `${h} 時 ${m%60} 分`;
  return `${Math.floor(h/24)} 天 ${h%24} 時`;
}

/* ============ 美國期貨交易時段 ============
   NQ 與 TVC:GOLD 都是美東週日 18:00 開盤、週五 17:00 收盤，每天 17:00～18:00 休息。
   Binance 合約 24/7 交易，不剔除的話週末會冒出 TradingView 上不存在的 K 棒與翻轉。
   美東與 UTC 的差是整小時（含夏令時間），所以用小時當快取鍵就夠。 */
const ETF = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", weekday:"short", hour:"2-digit", hourCycle:"h23"});
const ETC = new Map();
function et(t){
  const key = Math.floor(t/3600000);
  let v = ETC.get(key);
  if(!v){
    const ps = ETF.formatToParts(new Date(key*3600000));
    v = {wd: ps.find(x => x.type === "weekday").value, h: +ps.find(x => x.type === "hour").value % 24};
    ETC.set(key, v);
  }
  return v;
}
function cmeOpen(t){
  const {wd, h} = et(t);
  if(wd === "Sat") return false;
  if(wd === "Sun") return h >= 18;
  if(wd === "Fri") return h < 17;
  return h !== 17;
}
/* K 棒起點從美東 18:00 開盤起算（TradingView 的切法）。6 分剛好整除 60，跟整點對齊沒差；
   8 分不整除，用整點對齊會整根錯位。 */
function sessBucket(t, tf){
  const h = et(t).h, m = new Date(t).getUTCMinutes();
  const mins = ((h - 18 + 24) % 24) * 60 + m;
  return t - (mins % tf) * 60000;
}

/* ============ Pine 等價函式 ============ */
// ta.ema 與 ta.rma：前 len 個有效值用簡單平均當種子（Pine 原始定義）
function pineMA(src, len, alpha){
  const out = new Array(src.length).fill(null);
  let prev = null, sum = 0, cnt = 0;
  for(let i = 0; i < src.length; i++){
    const v = src[i];
    if(v == null){ out[i] = prev; continue; }
    if(prev === null){
      sum += v; cnt++;
      if(cnt === len){ prev = sum/len; out[i] = prev; }
    }else{
      prev = alpha*v + (1-alpha)*prev;
      out[i] = prev;
    }
  }
  return out;
}
const pineEma = (s, n) => pineMA(s, n, 2/(n+1));
const pineRma = (s, n) => pineMA(s, n, 1/n);
function pineSma(src, len){
  const out = new Array(src.length).fill(null); let s = 0;
  for(let i = 0; i < src.length; i++){
    s += src[i];
    if(i >= len) s -= src[i-len];
    if(i >= len-1) out[i] = s/len;
  }
  return out;
}
function trueRange(B){
  return B.map((b, i) => i === 0 ? b.h - b.l
    : Math.max(b.h - b.l, Math.abs(b.h - B[i-1].c), Math.abs(b.l - B[i-1].c)));
}
// 滑動極值，不含當根（= ta.highest(x,n)[1]），單調佇列 O(n)
function rollMax(x, n){
  const out = new Array(x.length).fill(null), dq = [];
  for(let i = 0; i < x.length; i++){
    if(i >= n) out[i] = x[dq[0]];
    while(dq.length && x[dq[dq.length-1]] <= x[i]) dq.pop();
    dq.push(i);
    if(dq[0] <= i - n) dq.shift();
  }
  return out;
}
function rollMin(x, n){
  const out = new Array(x.length).fill(null), dq = [];
  for(let i = 0; i < x.length; i++){
    if(i >= n) out[i] = x[dq[0]];
    while(dq.length && x[dq[dq.length-1]] >= x[i]) dq.pop();
    dq.push(i);
    if(dq[0] <= i - n) dq.shift();
  }
  return out;
}

/* ============ Range Filter：照「Optimized Range Filter for Gold」原始碼逐行移植 ============ */
function calcRF(B, P){
  const n = B.length;
  const src = B.map(b => (b.h + b.l) / 2);
  const diff = src.map((v, i) => i === 0 ? null : Math.abs(v - src[i-1]));
  const avrng = pineEma(diff, P.per);
  const smrng = pineEma(avrng, P.per*2 - 1).map(v => v == null ? null : v * P.mult);

  // rngfilt：前一根是 na 時 nz() 當成 0
  const filt = new Array(n).fill(null);
  let prev = null;
  for(let i = 0; i < n; i++){
    const x = src[i], r = smrng[i];
    if(r == null){ prev = null; continue; }
    const pv = prev == null ? 0 : prev;
    filt[i] = prev = x > pv ? (x - r < pv ? pv : x - r) : (x + r > pv ? pv : x + r);
  }

  const atr = pineRma(trueRange(B), P.atrLen);
  const volMa = pineSma(B.map(b => b.v || 0), P.volLen);
  const fcol = new Array(n).fill(0), pos = new Array(n).fill(0), sigs = [];
  let up = 0, dn = 0, ci = null, cur = 0;
  for(let i = 0; i < n; i++){
    const f = filt[i], pf = i ? filt[i-1] : null;
    if(f != null && pf != null){
      up = f > pf ? up + 1 : f < pf ? 0 : up;
      dn = f < pf ? dn + 1 : f > pf ? 0 : dn;
    }
    fcol[i] = up > 0 ? 1 : dn > 0 ? -1 : 0;
    const s = src[i], ps = i ? src[i-1] : null, moved = ps != null && s !== ps;
    const longCond  = f != null && s > f && moved && up > 0;
    const shortCond = f != null && s < f && moved && dn > 0;
    // 原碼：close > close - atr*mult。ATR 有值且大於 0 時恆成立，所以實際不擋訊號
    const c = B[i].c, a = atr[i];
    const longF  = !P.useAtr || (a != null && c > c - a * P.atrMult);
    const shortF = !P.useAtr || (a != null && c < c + a * P.atrMult);
    const volOK  = !P.useVol || (volMa[i] != null && (B[i].v || 0) > volMa[i] * 0.8);
    const longSig = longCond && longF && volOK, shortSig = shortCond && shortF && volOK;
    const pci = ci;
    ci = longSig ? 1 : shortSig ? -1 : pci;
    if(longSig && pci === -1){ cur = 1; sigs.push({i, d:1}); }
    else if(shortSig && pci === 1){ cur = -1; sigs.push({i, d:-1}); }
    pos[i] = cur;
  }
  const warm = 6 * P.per;   // 內層 EMA 收斂前通道偏窄，這段的訊號不列出
  return {pos, filt, fcol, all: sigs, sigs: sigs.filter(s => s.i >= warm), warm};
}

/* ============ Donchian：照「11分 Donchian 反轉 · 逆勢分批 v1.3.0」逐行移植（1 段） ============ */
function calcDon(B, P){
  const n = B.length;
  const look = Math.min(4999, Math.max(2, Math.round(P.lookH * 60 / P.tfMin)));
  const exitN = Math.max(10, Math.round(look / 3));
  const H = B.map(b => b.h), L = B.map(b => b.l);
  const hh = rollMax(H, look), ll = rollMin(L, look), he = rollMax(H, exitN), le = rollMin(L, exitN);
  const atr = pineRma(trueRange(B), P.atrLen);
  const rev = P.mode === "both";
  const pos = new Array(n).fill(0), avgA = new Array(n).fill(null), sigs = [];
  let dir = 0, side = 0, avg = null;
  for(let i = 0; i < n; i++){
    const c = B[i].c;
    if(hh[i] != null && c > hh[i] && P.mode !== "short") dir = 1;
    else if(ll[i] != null && c < ll[i] && P.mode !== "long") dir = -1;
    else if(!rev && dir === 1 && le[i] != null && c < le[i]) dir = 0;
    else if(!rev && dir === -1 && he[i] != null && c > he[i]) dir = 0;
    const flip = dir !== 0 && dir !== side;
    // 硬停損只在三態模式；停損後 dir 歸零，要等下一次突破才重進
    if(!rev && side !== 0 && atr[i] != null && atr[i] > 0 && (avg - c) * side >= P.stopAtr * atr[i]){
      sigs.push({i, d:0, why:"停損"});
      side = 0; avg = null; dir = 0;
    }
    if(!rev && dir === 0 && side !== 0){
      sigs.push({i, d:0, why:"出場"});
      side = 0; avg = null;
    }
    if(flip){ side = dir; avg = c; sigs.push({i, d:dir}); }
    pos[i] = side; avgA[i] = avg;
  }
  return {pos, avg:avgA, atr, look, exitN, hh, ll, all: sigs, sigs: sigs.filter(s => s.i >= look), warm: look};
}
/* v1.5.0：黃金上方策略專用，逐行對齊黃金儀表板 compute()（1 段、只做多）與 LINE 推播 donchian.js。
   跟上面 calcDon 有兩處不同，所以不共用：
   1. 停損後不把方向歸零，而是封鎖同方向，要先跌破出場線（方向離開多方）才接受下一次突破
      （calcDon 停損後只要再突破就立刻重進；7/23 停損那筆就是會分歧的情況）
   2. ATR 用 Wilder 版：前 n 根空白、第 n 根用簡單平均當種子 */
function calcDonG(B, P){
  const n = B.length;
  const look = Math.max(20, Math.round(P.lookH * 60 / P.tfMin));
  const exitN = Math.max(10, Math.round(look / 3));
  const H = B.map(b => b.h), L = B.map(b => b.l);
  const hh = rollMax(H, look), ll = rollMin(L, look), he = rollMax(H, exitN), le = rollMin(L, exitN);
  const tr = B.map((b, i) => i ? Math.max(b.h - b.l, Math.abs(b.h - B[i-1].c), Math.abs(b.l - B[i-1].c)) : null);
  const atr = new Array(n).fill(null);
  if(n > P.atrLen){
    let s = 0; for(let i = 1; i <= P.atrLen; i++) s += tr[i];
    atr[P.atrLen] = s / P.atrLen;
    for(let i = P.atrLen + 1; i < n; i++) atr[i] = (atr[i-1] * (P.atrLen - 1) + tr[i]) / P.atrLen;
  }
  const pos = new Array(n).fill(0), avgA = new Array(n).fill(null), sigs = [];
  let dir = 0, side = 0, avg = null, blocked = 0;
  for(let i = 0; i < n; i++){
    const c = B[i].c;
    if(i >= look){
      if(c > hh[i]) dir = 1;
      else if(c < ll[i]) dir = -1;
      else if(dir === 1 && c < le[i]) dir = 0;
      else if(dir === -1 && c > he[i]) dir = 0;
    }
    const a = atr[i];
    if(a != null && a > 0){
      if(blocked !== 0 && dir !== blocked) blocked = 0;
      if(side !== 0 && (avg - c) * side >= P.stopAtr * a){
        blocked = side; sigs.push({i, d:0, why:"停損"}); side = 0; avg = null;
      }
      if(side !== 0 && dir !== side){ sigs.push({i, d:0, why:"出場"}); side = 0; avg = null; }
      if(side === 0 && dir > 0 && dir !== blocked){ side = 1; avg = c; sigs.push({i, d:1}); }
    }
    pos[i] = side; avgA[i] = avg;
  }
  const warm = look + P.atrLen;
  return {pos, avg:avgA, atr, look, exitN, hh, ll, all: sigs, sigs: sigs.filter(s => s.i >= warm), warm};
}

/* ============ v1.9.0 通用趨勢反手（ATR 追蹤線）：逐行照 黃金分析儀表板\通用趨勢反手_v1.2.0.pine ============
   使用者 2026-10-14 要求 G、H、I 三格並行觀察。2026-04-06～10-13 QQQ 合約半年回測（扣單邊 3 點）：
   G 30 秒 60/70 +12.8%（94 筆、1 個月虧）、H 1 分 60/50 +11.2%（68 筆）、I 2 分 60/70 +11.5%（19 筆），
   現行 A/B −40.1%、C −37.3%、買進持有 +26.4%——三組都輸抱著，只在 7 月大盤 −6.8% 時賺。
   日線濾網：前一個已收盤交易日的 NQ 收盤 ÷ 60 日均線 ≥ 1 時不做空（改空手），多單不擋（Pine「只擋空單」）。 */
function calcAtrRev(B, P){
  const n = B.length, L = P.len, m = P.mult;
  const atr = pineRma(trueRange(B), L);
  const H = B.map(b => b.h), Lo = B.map(b => b.l);
  // ta.highest(high, L) 含當根＝不含當根的 rollMax 往後挪一根
  const hh1 = rollMax(H, L), ll1 = rollMin(Lo, L);
  const pos = new Array(n).fill(0), raw = new Array(n).fill(0), lsA = new Array(n).fill(null), ssA = new Array(n).fill(null);
  let lsp = null, ssp = null, d = 0;
  for(let i = 0; i < n; i++){
    const hh = i + 1 < n ? hh1[i + 1] : Math.max(...H.slice(n - L)), ll = i + 1 < n ? ll1[i + 1] : Math.min(...Lo.slice(n - L));
    const a = atr[i];
    if(a == null || hh == null || i < L - 1) continue;
    const ls0 = hh - m * a, ss0 = ll + m * a, c = B[i].c, pc = i ? B[i-1].c : c;
    const lprev = lsp == null ? ls0 : lsp, sprev = ssp == null ? ss0 : ssp;
    const ls = i && pc > lprev ? Math.max(ls0, lprev) : ls0;
    const ss = i && pc < sprev ? Math.min(ss0, sprev) : ss0;
    const sigL = c > (ssp == null ? c : ssp), sigS = c < (lsp == null ? c : lsp);
    if(d === 1){ if(sigS) d = -1; }
    else if(d === -1){ if(sigL) d = 1; }
    else d = sigL ? 1 : sigS ? -1 : 0;
    lsp = ls; ssp = ss; raw[i] = d; lsA[i] = ls; ssA[i] = ss;
  }
  const warm = L * 6;
  for(let i = 0; i < n; i++){
    let s = i < warm ? 0 : raw[i];
    if(s === -1 && dailyUp(B[i].t, P.regLen)) s = 0;
    pos[i] = s;
  }
  const all = [];
  for(let i = 1; i < n; i++) if(pos[i] !== pos[i-1]) all.push({i, d:pos[i]});
  return {pos, raw, ls:lsA, ss:ssA, atr, all, sigs: all.filter(s => s.i >= warm), warm};
}
/* 日線：中繼站 ?iv=1d（連續月 NQ=F，兩年）。交易日從美東 18:00 起算，用「這根之前最後一個已收盤交易日」。 */
let DAILY = null;
const ETD = new Intl.DateTimeFormat("en-CA", {timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit"});
const TDC = new Map();
function tradeDay(t){   // 美東 18:00 之後算下一個交易日
  const key = Math.floor((t + 6 * 3600000) / 3600000);
  let v = TDC.get(key);
  if(!v){ v = ETD.format(new Date(key * 3600000)); TDC.set(key, v); }
  return v;
}
function dailyUp(t, len){
  if(!DAILY) return true;
  const td = tradeDay(t);
  let lo = 0, hi = DAILY.d.length - 1, j = -1;
  while(lo <= hi){ const md = (lo + hi) >> 1; if(DAILY.d[md] < td){ j = md; lo = md + 1; } else hi = md - 1; }
  if(j < len - 1) return true;
  let sum = 0; for(let k = j - len + 1; k <= j; k++) sum += DAILY.c[k];
  return DAILY.c[j] / (sum / len) >= 1;
}
async function loadDaily(){
  const j = await jget(NQ_RELAY + "?iv=1d");
  if(j.error) throw new Error(j.error);
  // Yahoo 日線時間戳在交易日當天（美東 00:00 前後），+18 小時落在同一交易日的 18:00 之前
  DAILY = {d: j.bars.map(b => tradeDay(b[0] + 12 * 3600000)), c: j.bars.map(b => b[4])};
  PANELS.forEach(p => { if(p.kind === "atr") p.dirty = true; });
}

/* ============ 抓資料 ============ */
async function jget(url, opt){
  for(let tries = 0; ; tries++){
    const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
    try{
      const r = await fetch(url, Object.assign({cache:"no-store", signal:c.signal}, opt || {}));
      if(r.status === 429 || r.status === 418){
        setStatus("warn", "Binance 請求太頻繁，暫停 60 秒後繼續");
        await sleep(60000); continue;
      }
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){
      if(tries >= 2) throw e;
      await sleep(1500 * (tries + 1));
    }finally{ clearTimeout(t); }
  }
}
const kl = k => ({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]});

// 往回抓 1 分 K，直到交易時段內的分鐘數夠用
// v1.5.0：spot＝改抓 Binance 現貨（每頁上限 1000）；allDay＝24 小時都算，不只算 CME 時段
const SAPI = "https://data-api.binance.vision/api/v3";
const RAW1M = {};
async function loadKlines(sym, needMin, label, spot = false, allDay = false){
  const rev = []; let end = null, sess = 0;
  const base = spot ? SAPI : FAPI, lim = spot ? 1000 : 1500;
  const maxPages = Math.max(120, Math.ceil(needMin / lim) + 5);   // v1.5.1：黃金上方要 15 萬根 1 分 K，120 頁不夠
  for(let guard = 0; sess < needMin && guard < maxPages; guard++){
    const raw = await jget(`${base}/klines?symbol=${sym}&interval=1m&limit=${lim}` + (end ? `&endTime=${end}` : ""));
    if(!Array.isArray(raw) || !raw.length) break;
    const ch = raw.map(kl);
    for(let i = ch.length - 1; i >= 0; i--){ rev.push(ch[i]); if(allDay || cmeOpen(ch[i].t)) sess++; }
    end = ch[0].t - 1;
    setLoad(sym, sess/needMin, `${label} ${Math.min(100, Math.round(sess/needMin*100))}%`);
    if(ch.length < lim) break;
  }
  setLoad(sym, null);
  RAW1M[sym] = rev.reverse();
}
function mergeKline(sym, b){
  const a = RAW1M[sym]; if(!a) return;
  const last = a[a.length-1];
  if(!last || b.t > last.t) a.push(b);
  else if(b.t === last.t) a[a.length-1] = b;
  else{
    for(let i = a.length - 1; i >= 0 && a[i].t >= b.t; i--) if(a[i].t === b.t){ a[i] = b; break; }
  }
}
function aggSession(raw, tf){
  const out = []; let cur = null;
  for(const b of raw){
    if(!cmeOpen(b.t)) continue;
    const st = sessBucket(b.t, tf);
    if(!cur || cur.t !== st){
      if(cur) out.push(cur);
      cur = {t:st, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v, end:st + tf*60000};
    }else{
      if(b.h > cur.h) cur.h = b.h;
      if(b.l < cur.l) cur.l = b.l;
      cur.c = b.c; cur.v += b.v;
    }
  }
  if(cur) out.push(cur);
  return out;
}
/* v1.5.0：24 小時合成，時間桶從 1970 起算（Math.floor(t/ms)*ms），
   跟黃金儀表板、LINE 推播的 11 分 K 切法一致，三邊的訊號時間才對得上。 */
function aggAll(raw, tf){
  const ms = tf * 60000, out = []; let cur = null;
  for(const b of raw){
    const st = Math.floor(b.t / ms) * ms;
    if(!cur || cur.t !== st){
      if(cur) out.push(cur);
      cur = {t:st, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v, end:st + ms};
    }else{
      if(b.h > cur.h) cur.h = b.h;
      if(b.l < cur.l) cur.l = b.l;
      cur.c = b.c; cur.v += b.v;
    }
  }
  if(cur) out.push(cur);
  return out;
}

/* 30 秒線：由逐筆成交合成。Binance 合約沒有秒級 K 線。
   成交編號是連續整數，所以往回抓就是把 fromId 一次往前推 1000。 */
const S30 = {bars:[], lastId:null, ready:false, pending:[]};
const NEED30 = 3600, CACHE30 = "itd-30s-v1";
function addTrade(tr){
  if(S30.lastId != null && tr.a <= S30.lastId) return;
  S30.lastId = tr.a;
  if(!cmeOpen(tr.T)) return;
  const t = Math.floor(tr.T / 30000) * 30000, p = +tr.p, q = +tr.q, B = S30.bars;
  const last = B[B.length-1];
  if(!last || t > last.t){
    // 交易時段內沒有成交的 30 秒補一根平盤（NQ 本身幾乎每 30 秒都有成交）
    if(last && t - last.t <= 2*3600000){
      for(let x = last.t + 30000; x < t; x += 30000)
        if(cmeOpen(x)) B.push({t:x, o:last.c, h:last.c, l:last.c, c:last.c, v:0});
    }
    B.push({t, o:p, h:p, l:p, c:p, v:q});
  }else if(t === last.t){
    if(p > last.h) last.h = p;
    if(p < last.l) last.l = p;
    last.c = p; last.v += q;
  }
}
function save30(){
  try{
    const done = S30.bars.filter(b => b.t + 30000 <= Date.now()).slice(-NEED30 - 400);
    localStorage.setItem(CACHE30, JSON.stringify({lastId:S30.lastId, bars:done.map(b => [b.t, b.o, b.h, b.l, b.c, b.v])}));
  }catch(e){}
}
async function latestAggId(sym){
  const a = await jget(`${FAPI}/aggTrades?symbol=${sym}&limit=1`);
  return a[a.length-1].a;
}
async function forwardTrades(sym, toId, onProg){
  const from0 = S30.lastId;
  while(S30.lastId < toId){
    const ch = await jget(`${FAPI}/aggTrades?symbol=${sym}&fromId=${S30.lastId + 1}&limit=1000`);
    if(!ch.length) break;
    for(const tr of ch) addTrade(tr);
    if(onProg) onProg((S30.lastId - from0) / Math.max(1, toId - from0));
    if(ch.length < 1000) break;
    await sleep(800);
  }
}
/* v1.5.2：Binance aggTrades 依編號往回查只給最近 2 天（再往前回 400「Search window is restricted
   to recent 2 days only」）。週末過後 2 天內的交易時段湊不滿 3,600 根，整格就失敗。
   更早的部分改讀 data.binance.vision 的每日逐筆檔（允許跨網域；與 實際紀錄/更新紀錄.py 同一份資料）。
   zip 只有一個檔：從中央目錄讀壓縮後長度，再用瀏覽器內建的 DecompressionStream 解 deflate。 */
async function dailyTrades(sym, day){
  const r = await fetch(`https://data.binance.vision/data/futures/um/daily/aggTrades/${sym}/${sym}-aggTrades-${day}.zip`);
  if(!r.ok) return null;
  const buf = new Uint8Array(await r.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = buf.length - 22;
  while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) return null;
  const cd = dv.getUint32(e + 16, true);
  const method = dv.getUint16(cd + 10, true), csize = dv.getUint32(cd + 20, true), lho = dv.getUint32(cd + 42, true);
  const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
  let data = buf.subarray(start, start + csize);
  if(method === 8)
    data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  const out = [];
  for(const line of new TextDecoder().decode(data).split("\n")){
    const c = line.split(",");
    if(c.length < 6 || !/^\d/.test(c[0])) continue;   // 跳過標題列
    out.push({a:+c[0], p:c[1], q:c[2], T:+c[5]});
  }
  return out;
}
async function load30(sym){
  const label = "那斯達克 30 秒";
  const latest = await latestAggId(sym);
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(CACHE30) || "null"); }catch(e){}
  if(cache && cache.bars && cache.bars.length > NEED30 * 0.8 && latest - cache.lastId <= 60000){
    S30.bars = cache.bars.map(a => ({t:a[0], o:a[1], h:a[2], l:a[3], c:a[4], v:a[5]}));
    S30.lastId = cache.lastId;
    await forwardTrades(sym, latest, f => setLoad("t30", f, `${label} 補上次之後的成交 ${Math.round(f*100)}%`));
  }else{
    // 往回抓到交易時段內湊滿 NEED30 根為止；最多回溯 5 天
    const chunks = [], buckets = new Set();
    let from = latest - 999;
    for(let guard = 0; guard < 160 && from >= 0; guard++){
      let ch;
      try{ ch = await jget(`${FAPI}/aggTrades?symbol=${sym}&fromId=${from}&limit=1000`); }
      catch(e){ if(chunks.length) break; throw e; }   // 超出 2 天查不到：改由下面的每日檔補
      if(!ch.length) break;
      chunks.push(ch);
      for(const tr of ch) if(cmeOpen(tr.T)) buckets.add(Math.floor(tr.T/30000));
      const f = buckets.size / NEED30;
      setLoad("t30", f, `${label} 合成中 ${Math.min(100, Math.round(f*100))}%（逐筆成交 ${(chunks.length*1000).toLocaleString()} 筆）`);
      if(buckets.size >= NEED30 * 1.05 || ch[0].T < Date.now() - 5*86400000) break;
      from -= 1000;
      await sleep(800);   // aggTrades 每次權重 20，壓在每分鐘上限 2,400 以內
    }
    // 還不夠：從介面查到的最早那天往前，一天一天讀每日檔，最多回溯 7 天
    const days = [];
    if(buckets.size < NEED30 && chunks.length){
      const oldestId = chunks[chunks.length-1][0].a;
      let d = new Date(chunks[chunks.length-1][0].T);
      for(let k = 0; k < 7 && buckets.size < NEED30 * 1.05; k++){
        const day = d.toISOString().slice(0, 10);
        setLoad("t30", buckets.size / NEED30, `${label} 讀 ${day} 每日成交檔`);
        const tr = await dailyTrades(sym, day).catch(() => null);
        if(tr){
          const keep = tr.filter(x => x.a < oldestId);
          days.unshift(keep);
          for(const x of keep) if(cmeOpen(x.T)) buckets.add(Math.floor(x.T/30000));
        }
        d = new Date(d.getTime() - 86400000);
      }
    }
    S30.bars = []; S30.lastId = null;
    for(const tr of days.flat()) addTrade(tr);
    for(let c = chunks.length - 1; c >= 0; c--) for(const tr of chunks[c]) addTrade(tr);
    await forwardTrades(sym, latest);
  }
  if(S30.bars.length > NEED30 + 600) S30.bars = S30.bars.slice(-(NEED30 + 600));
  for(const tr of S30.pending) addTrade(tr);
  S30.pending = [];
  S30.ready = true;
  setLoad("t30", null);
  save30();
}

/* ============ 即時推送 ============ */
let WS = null, wsBackoff = 1000, lastMsg = 0;
function connectWS(){
  const streams = ["qqqusdt@aggTrade", "qqqusdt@kline_1m", "xauusdt@kline_1m"].join("/");
  try{ WS = new WebSocket(`wss://fstream.binance.com/stream?streams=${streams}`); }
  catch(e){ setTimeout(connectWS, 5000); return; }
  WS.onopen = () => { wsBackoff = 1000; setStatus("live", "即時連線中"); backfill(); };
  WS.onmessage = ev => {
    lastMsg = Date.now();
    const m = JSON.parse(ev.data), d = m.data;
    if(!d) return;
    if(d.e === "aggTrade"){
      const tr = {a:d.a, p:d.p, q:d.q, T:d.T};
      if(!S30.ready){ S30.pending.push(tr); return; }
      if(S30.lastId != null && tr.a > S30.lastId + 1) gapFill(tr.a - 1);
      addTrade(tr); dirty30();
    }else if(d.e === "kline"){
      const k = d.k, sym = d.s;
      mergeKline(sym, {t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v});
      for(const p of PANELS) if(p.kind === "don" && p.sym === sym) p.dirty = true;
    }
  };
  WS.onclose = () => {
    setStatus("warn", "即時連線中斷，重新連線中");
    setTimeout(connectWS, wsBackoff);
    wsBackoff = Math.min(30000, wsBackoff * 2);
  };
  WS.onerror = () => { try{ WS.close(); }catch(e){} };
}

async function backfill(){

    const a = RAW1M[sym]; if(!a || !a.length) continue;
    try{
      const raw = await jget(`${FAPI}/klines?symbol=${sym}&interval=1m&limit=1500&startTime=${a[a.length-1].t}`);
      for(const k of raw) mergeKline(sym, kl(k));
      for(const p of PANELS) if(p.sym === sym) p.dirty = true;
    }catch(e){}
  }
  if(S30.ready){ try{ await gapFill(await latestAggId("QQQUSDT")); }catch(e){} }
}

/* ============ 計算 ============ */
function recompute(p){
  let B;
  if(p.src === "hsi"){
    // v1.19.0 恆生：TradingView「恆生傳送」警報送來的 30 秒 K（每根都是收盤後才送，全部算收完）
    B = HSI.bars; const need = p.P.per * 6 + 10, w = $("wait-" + p.k);
    if(B.length < need){
      w.hidden = false;
      w.textContent = B.length ? `恆生資料累積中：已收到 ${B.length} 根 30 秒 K（到 ${tText(B[B.length-1].t)}），暖機要約 ${need} 根；警報剛建好時每分鐘補約 50 根舊 K`
                               : (HSI.err || "還沒收到恆生資料：要在 TradingView 小型恆生期貨 30 秒圖掛「恆生傳送」並建警報");
      p.ready = false; return;
    }
    p.done = B.length;
    if(!p.userZoom) p.view.span = p.span = Math.min(B.length, 1500);
  }else if(p.src === "gate"){
    // Gate 原生 30 秒 K（含無成交的 0 量 K）；只留 CME 時段，與 A-1 同切法
    const raw = RAW1M[p.sym]; if(!raw) return;
    B = raw.filter(b => cmeOpen(b.t));
    p.done = B.length && B[B.length-1].t + 30000 > Date.now() ? B.length - 1 : B.length;
    if(S30.bars.length){   // 顯示範圍按時間對齊 A-1
      const t0 = S30.bars[0].t;
      p.span = Math.max(30, B.filter(b => b.t >= t0).length);
      if(!p.userZoom) p.view.span = p.span;
    }
  }else if(p.src === "gtr"){
    // v1.10.0：Gate 逐筆合成的 37／22 秒 K（切法同 更新紀錄.py 的 bars_G）
    if(!GTR.ready) return;
    B = GTR.bars[p.tfSec]; const ms = p.tfSec * 1000;
    p.done = B.length && B[B.length-1].t + ms > Date.now() ? B.length - 1 : B.length;
    if(S30.bars.length){   // 顯示範圍按時間對齊 A-1
      const t0 = S30.bars[0].t;
      p.span = Math.max(30, B.filter(b => b.t >= t0).length);
      if(!p.userZoom) p.view.span = p.span;
    }
  }else if(p.src === "tx"){
    // v1.11.0 台指：盤後資料檔，每根都已收完；v1.12.0 接上即時 K，最後一根要等後面有新的 1 秒 K 才算收完
    if(!TX.ready) return;
    B = TX.bars[p.tfSec]; p.done = B.length;
    if(TX.liveN[p.tfSec] && TX.live.length && B[B.length-1].t + p.tfSec * 1000 > TX.live[TX.live.length-1][0] * 1000) p.done = B.length - 1;
    if(!p.userZoom) p.view.span = p.span = TX.span[p.tfSec];
  }else if(p.src === "hl"){
    // 只留 CME 交易時段，跟 30 秒那格與 TradingView 的切法一致
    const raw = RAW1M[p.sym]; if(!raw) return;
    B = raw.filter(b => cmeOpen(b.t));
    p.done = B.length && B[B.length-1].t + 60000 > Date.now() ? B.length - 1 : B.length;
    // v1.2.1：顯示範圍按時間對齊上面 30 秒那格的第一根（v1.2.0 固定 2,100 根，兩格起點差一個多小時）
    if(S30.bars.length){
      const t0 = S30.bars[0].t;
      p.span = Math.max(30, B.filter(b => b.t >= t0).length);
      if(!p.userZoom) p.view.span = p.span;
    }
  }else if((p.kind === "rf" || p.kind === "atr") && !p.tfMin){
    if(!S30.ready) return;
    B = S30.bars;
    const now = Date.now();
    p.done = B.length && B[B.length-1].t + 30000 > now ? B.length - 1 : B.length;
  }else{
    let raw = RAW1M[p.sym]; if(!raw) return;
    // I 格：中繼站較早那段是 5 分 K，切成 2 分會讓 ATR 失真，只用 2 分 K 那段（約 36 天）
    if(p.kind === "atr" && p.src === "yahoo") raw = raw.filter(b => b.t >= YCUT);
    B = p.allDay ? aggAll(raw, p.tfMin) : aggSession(raw, p.tfMin);
    const now = Date.now(), last = B[B.length-1];
    // Yahoo 延遲 10 分鐘：時間到了不代表收完，要看原始 K 線有沒有涵蓋到這根的結尾
    const rawEnd = p.src === "yahoo" && raw.length ? raw[raw.length-1].t + 120000 : now;
    p.done = last && (last.end > now || last.end > rawEnd) ? B.length - 1 : B.length;
  }
  p.bars = B;
  const done = B.slice(0, p.done);
  if(p.kind === "atr" && !DAILY) return;
  p.R = p.kind === "rf" ? calcRF(done, p.P) : p.kind === "atr" ? calcAtrRev(done, p.P) : p.goldExact ? calcDonG(done, p.P) : calcDon(done, p.P);
  if(p.flatShort) toFlatShort(p.R);
  p.ready = true;
  $("wait-" + p.k).hidden = true;
}

function entryOf(p){
  const R = p.R; if(!R || !p.done) return null;
  const side = R.pos[p.done - 1];
  if(!side) return {side:0};
  // 用全部訊號找：目前的部位可能是暖機區內建立的，訊號清單不列，但進場價要算得出來
  for(let k = R.all.length - 1; k >= 0; k--){
    const s = R.all[k];
    if(s.d === side) return {side, i:s.i, t:p.bars[s.i].t, price:p.bars[s.i].c};
  }
  return {side};
}

function renderInfo(p){
  if(!p.ready) return;
  const R = p.R, B = p.bars, last = B[B.length-1];
  const e = entryOf(p) || {side:0};
  const badge = $("dir-" + p.k);
  // 空手時標籤顏色跟線色一致：那斯達克中長趨勢空手畫綠、黃金空手畫紅
  const flatCls = p.flatCol === COL[1] ? "long" : p.flatCol ? "short" : "";
  badge.className = "badge " + (e.side > 0 ? "long" : e.side < 0 ? "short" : flatCls);
  badge.textContent = e.side > 0 ? "持多" : e.side < 0 ? "持空" : "空手";

  // 浮動點數：那斯達克兩格用換算後的那斯達克點數（跟交易明細一樣），換算比例還沒出來就先不顯示
  let flt = "";
  if(e.side && e.price && (!p.nq || RATIO)){
    const T = TRADE_K.find(x => x.pk === p.k), d = T && T.d || 0;
    const v = (fx(p, last.c) - fx(p, e.price)) * e.side;
    // v1.13.0 那斯達克改顯示微型那斯達克 1 口的台幣（已扣來回手續費），點數放滑鼠提示
    const C = costOf(T);   // v1.14.0 台指也換算（微台）
    if(C){ const nt = C.nt(v, e.price, last.c); flt = `<span class="flt ${ud(Math.round(nt))}" title="${sgn(v)} 點">${ntFmt(nt)}</span>`; }
    else flt = `<span class="flt ${ud(+v.toFixed(d))}">${sgn(v, d)}</span>`;
  }
  // 下一個會讓部位改變的價位
  let trig = "—", trigK = "觸發線";
  const done = B.slice(0, p.done);
  if(p.kind === "rf"){
    trigK = "濾網線"; trig = fmtP(p, R.filt[p.done - 1]);
  }else if(p.kind === "atr"){
    const d = R.raw[p.done - 1];
    if(d > 0){ trigK = "翻空線"; trig = fmtP(p, R.ls[p.done - 1]); }
    else if(d < 0){ trigK = e.side < 0 ? "翻多線" : "翻多線（日線在均線上，不做空）"; trig = fmtP(p, R.ss[p.done - 1]); }
  }else{
    const look = R.look, exitN = R.exitN, n = done.length;
    const hi = (m) => Math.max(...done.slice(n - m).map(b => b.h));
    const lo = (m) => Math.min(...done.slice(n - m).map(b => b.l));
    if(p.P.mode === "both"){
      if(e.side > 0){ trigK = "翻空線"; trig = fmtP(p, lo(look)); }
      else if(e.side < 0){ trigK = "翻多線"; trig = fmtP(p, hi(look)); }
      else { trigK = "突破／跌破"; trig = fmtP(p, hi(look)) + "／" + fmtP(p, lo(look)); }
    }else if(e.side > 0){
      const a = R.atr[n - 1], stop = R.avg[n - 1] - p.P.stopAtr * a;
      const out = Math.max(lo(exitN), stop);
      trigK = out === stop ? (p.flatShort ? "停損翻空" : "停損線") : (p.flatShort ? "翻空線" : "出場線"); trig = fmtP(p, out);
    }else{
      trigK = p.flatShort ? "翻多線" : "進場線"; trig = fmtP(p, hi(look));
    }
  }
  $("px-" + p.k).innerHTML = fmtP(p, last.c);
  const parts = [];
  // 台指是盤後資料，持有時間算到現在不準；改放「資料到幾點」，手機上才不會被截掉（v1.12.0 有即時 K 時寫「即時到」）
  const txTo = p.src === "tx"
    ? `${TX.liveN[p.tfSec] ? "即時到" : "盤後到"} <b>${tText(last.t)}</b>` +
      (TX.hold ? `<span title="換月日 TradingView 的即時 K 可能還是舊合約，差 150 點以上，所以先只看盤後資料">（換月中）</span>` : "")
    : p.src === "hsi" ? `資料到 <b>${tText(last.t)}</b>（延遲約 15 分）` : "";
  const toLine = p.src === "tx" || p.src === "hsi";
  if(e.t) parts.push(`進場 <b>${tText(e.t)}</b> @<b>${fmtP(p, e.price)}</b>`, toLine ? txTo : `<b>${durText(Date.now() - e.t)}</b>`);
  else if(toLine) parts.push(txTo);
  parts.push(`${trigK} <b>${trig}</b>`);
  let fw = "";   // v1.18.0 即時資料中斷／漏資料警告
  if(p.src === "tx" || p.src === "hsi"){
    const f = p.src === "tx" ? txFeed() : hsiFeed(), g = p.src === "tx" ? txGaps() : hsiGaps();
    if(f) fw = `<span class="feedw" title="${f.long}">${f.short}</span>`;
    if(g.n) fw += `<span class="feedg" title="盤後檔還沒補到的時段裡，即時 1 秒 K 有 ${g.n} 段缺超過 1 分鐘（共約 ${g.min} 分鐘）；盤後檔補上後就會被正本補齊">漏 ${g.n} 段</span>`;
  }
  $("kv-" + p.k).innerHTML = fw + `<span class="kvt">${parts.join(" · ")}</span>` + flt;
}

  {k:"O1", pk:"o2nq", blink:true, name:"觀察二 那斯達克 555/23", unit:"點"},     // v1.19.0 紀錄程式 O1，10/6 起回算
  {k:"O2", pk:"o2nq37", blink:true, name:"觀察二 那斯達克 37/37", unit:"點"},    // v1.19.0 紀錄程式 O2
  {k:"HSI", pk:"o2hsi", blink:true, name:"觀察二 恆生", unit:"點", self:"hsi"},  // v1.19.0 網頁自算（TradingView 警報資料暖機完成起）
  {k:"R30", pk:"atr30", name:"G",    unit:"點"},   // v1.9.0 觀察頁，紀錄 2026-10-14 起算
  {k:"R1",  pk:"atr1",  name:"H",    unit:"點"},
  {k:"R2",  pk:"atr2",  name:"I",    unit:"點"},
];
const SIDE_N = {"多":1, "空":-1, "空手":0}, SIDE_T = {1:"多", "-1":"空", 0:"空手"};
let LOGROWS = null, LOGCOVER = {}, logAt = 0, logErr = "", logBusy = false, tradeK = "A", tradeSig = "";
try{ tradeK = localStorage.getItem("itd-trade-k") || "A"; }catch(e){}
function parseCSV(txt){
  const out = []; let row = [], f = "", q = false;
  txt = txt.replace(/^﻿/, "");
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){ if(ch === '"'){ if(txt[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true;
    else if(ch === ","){ row.push(f); f = ""; }
    else if(ch === "\n" || ch === "\r"){
      if(ch === "\r" && txt[i+1] === "\n") i++;
      row.push(f); f = ""; if(row.length > 1) out.push(row); row = [];
    }else f += ch;
  }
  if(f || row.length){ row.push(f); if(row.length > 1) out.push(row); }
  const head = out.shift() || [];
  return out.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}
async function loadLog(){
  if(logBusy) return; logBusy = true;
  try{
    const r = await fetch("實際紀錄/進出紀錄.csv?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    LOGROWS = parseCSV(await r.text()).map(x => ({k:x["格子"], t:+x["時間戳"], act:x["動作"], side:SIDE_N[x["部位"]],
      p:+x["價格"], nq:x["換算那斯達克"] ? +x["換算那斯達克"] : null, note:x["備註"]})).sort((a, b) => a.t - b.t);
    logAt = Date.now(); logErr = "";
    // 紀錄程式每次跑完寫「各組算到幾點」：那之前它已確認沒有新交易，網頁從那之後接著算
    try{ const s = await fetch("實際紀錄/紀錄狀態.json?t=" + Date.now(), {cache:"no-store"}); LOGCOVER = s.ok ? (await s.json())["算到"] || {} : {}; }
    catch(e){ LOGCOVER = {}; }
  }catch(e){ logErr = "讀不到進出紀錄：" + (e.message || e); }
  logBusy = false; tradeSig = ""; renderTrades();
}
function tradesOf(T){
  const p = PAN(T.pk);
  let rows;
  if(T.self){
    // 台指：起算那根（10/6 第一根、且已過暖機）的部位當「起算持有」，之後逐根照格子的部位接著算
    rows = [];
    if(p.ready && p.R && p.done){
      // v1.19.0 恆生（self:"hsi"）沒有固定起算日：從資料暖機完成那根開始
      const st = T.self === "hsi" ? 0 : TX_START, s = p.bars.findIndex((b, i) => i >= p.R.warm && b.t >= st);
      if(s >= 0) rows.push({k:T.k, t:p.bars[s].t, act:"起算持有", side:p.R.pos[s], p:p.bars[s].c, nq:null, note:""});
    }
    TX.rollRows = rows.length && T.self !== "hsi" ? (TX.rolls[p.tfSec] || []).filter(r => r.t > rows[0].t) : [];
  }else rows = LOGROWS.filter(r => r.k === T.k).map(r => Object.assign({}, r));
  // 換算那斯達克點數：照 更新紀錄.py 的 nqconv，用當時那一分鐘（往前找 30 分鐘內）的 Hyperliquid 收盤÷當根價格，
  // 找不到才用現在的比例。用現在的比例會跟正式紀錄差 10 點以上（盈虧點數不受影響，算法是漲跌 %×進場點數）。

/* v1.3.0 分頁：只顯示目前那頁的兩格；四格資料都在背景持續更新，切頁不重新載入。記住上次停的頁。 */
const PAGE_KEY = "itd-page";
function showPage(pg){
  if(!PANELS.some(p => p.pg === pg)) pg = "short";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.pg === pg));
  for(const p of PANELS) $("p-" + p.k).hidden = p.pg !== pg;
  try{ localStorage.setItem(PAGE_KEY, pg); }catch(e){}
  for(const p of PANELS) if(p.pg === pg) draw(p);
}
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {ctx, w, h};
}
function niceStep(range, n){
  const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
}
function viewRange(p){
  const n = p.bars.length;
  const span = Math.max(30, Math.min(p.view.span, n));
  const off = Math.max(0, Math.min(p.view.off, n - span));
  p.view.span = span; p.view.off = off;
  const i1 = n - 1 - off;
  return {i0: Math.max(0, i1 - span + 1), i1, span};
}
const PADR = 40;   // 右側刻度欄寬的預設值；實際寬度每次繪圖依數字寬度算出，存在 p.padR
const COL = {1:"#ff3b3b", "-1":"#4cff00", 0:"#7a8494"};
const posCol = (p, s) => s === 0 && p.flatCol ? p.flatCol : COL[s];

function draw(p){
  if(!p.ready || !p.bars.length) return;
  if($("p-" + p.k).hidden) return;   // 另一頁的格子：資料照常更新，切過來時再畫
  const cv = $("cv-" + p.k), {ctx, w, h} = setupCanvas(cv);
  const B = p.bars, R = p.R, {i0, i1, span} = viewRange(p);
  const padB = 22, padT = 8, ph = h - padB - padT;
  const posAt = i => i < p.done ? R.pos[i] : R.pos[p.done - 1] || 0;

  let lo = Infinity, hi = -Infinity;
  for(let i = i0; i <= i1; i++){
    const c = B[i].c; if(c < lo) lo = c; if(c > hi) hi = c;
    if(p.kind === "rf" && i < p.done && R.filt[i] != null){ const f = R.filt[i]; if(f < lo) lo = f; if(f > hi) hi = f; }
  }
  if(hi === lo){ hi += 1; lo -= 1; }
  const padY = (hi - lo) * 0.08; lo -= padY; hi += padY;
  const Y = v => padT + (hi - v) / (hi - lo) * ph;

  /* 右側刻度欄：v1.0.3 把刻度疊在圖上，數字和走勢線、最新價標籤擠在一起。
     v1.0.4 改回獨立欄位，但寬度依最寬的數字自動決定（10px 字約 38 像素），不再固定 70。 */
  const k = p.nq && RATIO ? RATIO : 1;
  const step = Math.max(1, niceStep((hi - lo) * k, 5)) / k;   // 刻度不顯示小數，間距至少 1
  ctx.font = "10px system-ui,sans-serif";
  const ticks = [];
  for(let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push([v, Math.round(Y(v)) + 0.5]);
  const lastC = B[B.length-1].c, ly = Y(lastC), lastTxt = fmtP(p, lastC);
  const padR = Math.ceil(Math.max(ctx.measureText(lastTxt).width, ...ticks.map(t => ctx.measureText(fmtP(p, t[0])).width)) + 10);
  p.padR = padR;
  const pw = w - padR, bw = pw / span, X = i => (i - i0 + 0.5) * bw;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#0e121b"; ctx.fillRect(0, 0, w, h);

  // 水平格線
  ctx.strokeStyle = "#1b2130"; ctx.lineWidth = 1;
  for(const [, y] of ticks){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(pw, y); ctx.stroke(); }
  // 時間刻度：每隔至少 90 像素標一次，跨日標日期
  const every = Math.max(1, Math.ceil(90 / bw));
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
  for(let i = i0; i <= i1; i++){
    if((i - i0) % every) continue;
    const t = B[i].t, x = X(i), prevT = i > 0 ? B[i-1].t : 0;
    // 畫面涵蓋超過兩天時只標日期（縮到最小時一格就是兩個月，標時分看不出是哪天）
    const label = B[i1].t - B[i0].t > 2*86400000 ? tText(t).slice(0, 5)
      : new Date(t).getDate() !== new Date(prevT).getDate() || (i - i0) === 0 ? tText(t).slice(0, 5) + " " + hm(t) : hm(t);
    ctx.fillStyle = "#6f7891";
    // 最左邊的標籤置中會被切掉一半，改靠左對齊
    const tw = ctx.measureText(label).width;
    ctx.fillText(label, Math.max(tw / 2 + 2, x), h - 6);
    ctx.strokeStyle = "#161b27"; ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, padT); ctx.lineTo(Math.round(x) + 0.5, padT + ph); ctx.stroke();
  }
  ctx.textAlign = "left";

  // 依顏色分段畫線：每一段的顏色取段尾那根的狀態（跟 Pine 的 plot 一樣）
  function colorLine(val, colAt, width){
    let run = null;
    ctx.lineWidth = width; ctx.lineJoin = "round";
    for(let i = Math.max(i0, 1); i <= i1; i++){
      const a = val(i - 1), b = val(i);
      if(a == null || b == null){ if(run){ ctx.stroke(); run = null; } continue; }
      const c = colAt(i);
      if(c !== run){
        if(run !== null) ctx.stroke();
        ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(X(i - 1), Y(a)); run = c;
      }
      ctx.lineTo(X(i), Y(b));
    }
    if(run !== null) ctx.stroke();
  }
  if(p.kind === "rf"){
    colorLine(i => B[i].c, () => "rgba(170,178,196,.55)", 1);
    colorLine(i => i < p.done ? R.filt[i] : (p.done ? R.filt[p.done - 1] : null),
              i => COL[i < p.done ? R.fcol[i] : R.fcol[p.done - 1]], 2.5);
  }else{
    colorLine(i => B[i].c, i => posCol(p, posAt(i)), 1.4);   // v1.2.1：2 → 1.4（使用者說太粗，縮 0.7）
  }

  // 訊號三角形：只標進場（翻多紅、翻空綠）
  for(const s of R.sigs){
    if(s.i < i0 || s.i > i1 || !s.d) continue;
    const x = X(s.i), y = Y(B[s.i].c), up = s.d > 0;
    ctx.fillStyle = COL[s.d];
    ctx.beginPath();
    if(up){ ctx.moveTo(x, y + 6); ctx.lineTo(x - 5, y + 15); ctx.lineTo(x + 5, y + 15); }
    else  { ctx.moveTo(x, y - 6); ctx.lineTo(x - 5, y - 15); ctx.lineTo(x + 5, y - 15); }
    ctx.fill();
  }

  // 價格刻度：畫在右側欄，跟最新價標籤太近的那個不畫，免得疊在一起
  ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#7d869d";
  for(const [v, y] of ticks){
    if(y < padT + 5 || y > padT + ph - 2 || Math.abs(y - ly) < 13) continue;
    ctx.fillText(fmtP(p, v), w - 4, y);
  }
  ctx.textAlign = "left";

  // 最新價虛線與標籤
  if(p.view.off === 0 || (ly > padT && ly < padT + ph)){
    ctx.setLineDash([2, 3]); ctx.strokeStyle = "#22c7e8"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(pw, ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#22c7e8"; ctx.fillRect(pw + 1, ly - 8, padR - 1, 16);
    ctx.fillStyle = "#03121a"; ctx.textBaseline = "middle"; ctx.textAlign = "right"; ctx.fillText(lastTxt, w - 4, ly);
    ctx.textAlign = "left";
  }

  // 十字線
  const tip = $("tip-" + p.k);
  const hv = idxAtTime(p, hoverT);   // v1.8.1：六格共用游標時間
  if(hv != null && hv >= i0 && hv <= i1){
    const i = hv, x = X(i);
    ctx.strokeStyle = "rgba(200,210,230,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, padT); ctx.lineTo(Math.round(x) + 0.5, padT + ph); ctx.stroke();
    const ps = posAt(i), st = ps > 0 ? "持多" : ps < 0 ? "持空" : "空手";
    tip.textContent = `${tText(B[i].t)}　收 ${fmtP(p, B[i].c)}　${st}` + (i >= p.done ? "（形成中）" : "");
  }else tip.textContent = "";
}

/* v1.8.1：十字線六格同步（使用者 2026-10-13 要求）。共用「游標時間」hoverT，每格畫圖時各自找出
   涵蓋那個時間的 K 棒（30 秒、1 分、6/8/11 分各自對齊）；時間不在該格畫面範圍內就不畫、不自動捲動。
   游標一動，所有格子在下一個畫格合併重畫一次（看不到的那頁 draw 會直接跳過）。 */
let hoverT = null, hoverRaf = 0;
function idxAtTime(p, t){
  const B = p.bars;
  if(t == null || !p.ready || !B.length || t < B[0].t) return null;
  let lo = 0, hi = B.length - 1;   // 最後一根開始時間 ≤ t 的 K 棒
  while(lo < hi){ const m = (lo + hi + 1) >> 1; if(B[m].t <= t) lo = m; else hi = m - 1; }
  return lo;
}
function setHoverT(t){
  hoverT = t;
  if(!hoverRaf) hoverRaf = requestAnimationFrame(() => { hoverRaf = 0; PANELS.forEach(draw); });
}

// 以畫面某個位置為錨點縮放（anchor01：0＝最左、1＝最右）
function zoomAt(p, f, anchor01){
  p.userZoom = true;   // 使用者自己縮放過，就不再自動對齊時間範圍
  const {i0, span} = viewRange(p), n = p.bars.length;
  const idx = i0 + anchor01 * span;
  const ns = Math.max(30, Math.min(n, Math.round(span * f)));
  const ni0 = idx - anchor01 * ns;
  p.view.span = ns;
  p.view.off = Math.max(0, Math.min(n - ns, Math.round(n - (ni0 + ns))));
}
function bindChart(p){
  const cv = $("cv-" + p.k);
  let drag = null;
  const idxAt = ex => {
    const r = cv.getBoundingClientRect(), {i0, span} = viewRange(p);
    const pw = r.width - (p.padR || PADR);
    return Math.max(0, Math.min(p.bars.length - 1, i0 + Math.floor((ex - r.left) / pw * span)));
  };
  cv.addEventListener("pointerdown", e => { if(!p.ready) return; drag = {x:e.clientX, off:p.view.off}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if(!p.ready) return;
    if(drag){
      const r = cv.getBoundingClientRect(), bw = (r.width - (p.padR || PADR)) / p.view.span;
      p.view.off = Math.max(0, Math.round(drag.off + (e.clientX - drag.x) / bw));
    }
    setHoverT(p.bars[idxAt(e.clientX)].t);
  });
  const end = () => { drag = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("pointerleave", () => setHoverT(null));
  cv.addEventListener("wheel", e => {
    if(!p.ready) return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    zoomAt(p, e.deltaY > 0 ? 1.15 : 1/1.15, Math.min(1, (e.clientX - r.left) / (r.width - (p.padR || PADR))));
    draw(p);
  }, {passive:false});
}

    body:JSON.stringify({type:"candleSnapshot", req:{coin, interval:"1m", startTime:start, endTime:Date.now() + 60000}})});
  return r.map(k => ({t:+k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v}));
}
async function loadHL(p){
  RAW1M[p.sym] = await hlCandles(p.sym, Date.now() - 5000 * 60000);
  PANELS.forEach(x => { if(x.sym === p.sym) x.dirty = true; });
}

const GATE_FAPI = "https://api.gateio.ws/api/v4/futures/usdt";
const gk = k => ({t:k.t * 1000, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v});
async function loadGate(p){
  const now = Math.floor(Date.now() / 1000), all = new Map();
  for(let pg = 0; pg < 5; pg++){
    const to = now - pg * 30 * 2000, from = to - 30 * 1999;
    let r;
    try{ r = await jget(`${GATE_FAPI}/candlesticks?contract=${p.sym}&interval=30s&from=${from}&to=${to}`); }
    catch(e){ if(all.size) break; throw e; }      // 超出可回溯範圍就停
    for(const k of r) all.set(k.t, gk(k));
    setLoad("gate", (pg + 1) / 5, `Gate 30 秒 ${Math.round((pg + 1) / 5 * 100)}%`);
  }
  setLoad("gate", null);
  RAW1M[p.sym] = [...all.values()].sort((a, b) => a.t - b.t);
  PANELS.forEach(x => { if(x.sym === p.sym) x.dirty = true; });   // B、B2 共用
}
async function pollGate(p){
  if(!RAW1M[p.sym]) return;

/* v1.10.0：B2（37 秒）、B3（22 秒）用 Gate 逐筆成交自己合成——Gate 原生 K 沒有這兩種週期。
   切法逐行照 更新紀錄.py 的 bars_G：時間桶從 1970 起算、只留 CME 時段、交易時段內沒成交補平盤（缺口 2 小時內）、
   同一毫秒的成交依價格、數量排序（同 Python 的 tuple 排序）。
   第一次往回抓 5 天（B2 暖機約 2,700 根≈28 個交易小時，中間可能隔週末），每 15 分鐘一段、8 段同時抓、滿 1,000 筆對半切；
   合成好的 K 每分鐘存進瀏覽器，重開時丟掉最後 10 分鐘那幾根、只從那裡補抓。之後每 10 秒輪詢新成交（只收編號更大的）。 */
const GTR = {bars:{}, lastId:0, lastT:0, ready:false}, GTR_TFS = [37, 22], GTR_KEY = "itd-gtr-v1";
const gtrTr = x => [Math.round(+x.create_time * 1000), +x.price, Math.abs(+x.size), x.id];
const gtrSort = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
function gtrAdd(B, ms, trades){
  for(const [T, p, q] of trades){
    if(!cmeOpen(T)) continue;
    const s = Math.floor(T / ms) * ms, L = B[B.length-1];
    if(!L || s > L.t){
      if(L && s - L.t <= 7200000) for(let x = L.t + ms; x < s; x += ms) if(cmeOpen(x)) B.push({t:x, o:L.c, h:L.c, l:L.c, c:L.c, v:0});
      B.push({t:s, o:p, h:p, l:p, c:p, v:q});
    }else if(s === L.t){ L.h = Math.max(L.h, p); L.l = Math.min(L.l, p); L.c = p; L.v += q; }
  }
}
function gtrIngest(trades, cut){
  if(!trades.length) return;
  for(const tf of GTR_TFS){
    const c = cut ? cut[tf] : -Infinity;
    gtrAdd(GTR.bars[tf], tf * 1000, c > -Infinity ? trades.filter(x => x[0] >= c) : trades);
    const old = Date.now() - 6 * 86400000, B = GTR.bars[tf];
    if(B.length && B[0].t < old) GTR.bars[tf] = B.filter(b => b.t >= old);
  }
  for(const x of trades){ if(x[3] > GTR.lastId) GTR.lastId = x[3]; if(x[0] > GTR.lastT) GTR.lastT = x[0]; }
  PANELS.forEach(p => { if(p.src === "gtr") p.dirty = true; });
}
async function gtrPage(a, b){
  const j = await jget(`${GATE_FAPI}/trades?contract=QQQ_USDT&limit=1000&from=${a}&to=${b}`);
  if(j.length >= 1000 && b - a > 10){ const m = Math.floor((a + b) / 2); return (await gtrPage(a, m)).concat(await gtrPage(m, b)); }
  return j;
}
async function gtrFetch(fromMs, prog){
  const end = Math.floor(Date.now() / 1000), segs = [];
  for(let t = Math.floor(fromMs / 1000); t < end; t += 900) segs.push([t, Math.min(end, t + 900)]);
  const got = new Map(); let i = 0, done = 0;
  const worker = async () => {
    while(i < segs.length){
      const s = segs[i++];
      for(const x of await gtrPage(s[0], s[1])) got.set(x.id, x);
      done++; if(prog) setLoad("gtr", done / segs.length, `Gate 逐筆（B2、B3）${Math.round(done / segs.length * 100)}%`);
    }
  };
  await Promise.all(Array.from({length:8}, worker));
  if(prog) setLoad("gtr", null);
  return [...got.values()].map(gtrTr).filter(x => x[0] >= fromMs).sort(gtrSort);
}
async function loadGTR(){
  let c = null; try{ c = JSON.parse(localStorage.getItem(GTR_KEY)); }catch(e){}
  const now = Date.now(); let from, cut = null;
  if(c && c.at > now - 4 * 86400000 && c.bars){
    // 丟掉最後 10 分鐘那幾根；每種週期從自己被丟的那根開始收成交，抓取從最早那根的起點開始
    const F = c.at - 600000; cut = {};
    for(const tf of GTR_TFS){
      const ms = tf * 1000; cut[tf] = Math.floor(F / ms) * ms;
      GTR.bars[tf] = (c.bars[tf] || []).filter(a => a[0] < cut[tf]).map(a => ({t:a[0], o:a[1], h:a[2], l:a[3], c:a[4], v:a[5]}));
    }
    from = Math.min(...Object.values(cut));
  }else{
    from = now - 5 * 86400000; for(const tf of GTR_TFS) GTR.bars[tf] = [];
  }
  gtrIngest(await gtrFetch(from, true), cut);
  GTR.ready = true; gtrSave();
  PANELS.forEach(p => { if(p.src === "gtr") p.dirty = true; });
}
async function pollGTR(){
  if(!GTR.ready) return;
  const n = Math.floor(Date.now() / 1000), a = Math.floor(GTR.lastT / 1000) - 5;
  const tr = (await gtrPage(a, n)).map(gtrTr).filter(x => x[3] > GTR.lastId).sort(gtrSort);
  gtrIngest(tr, null);
}
function gtrSave(){
  if(!GTR.ready) return;
  const r = v => Math.round(v * 1000) / 1000, bars = {};
  for(const tf of GTR_TFS) bars[tf] = GTR.bars[tf].map(b => [b.t, r(b.o), r(b.h), r(b.l), r(b.c), Math.round(b.v)]);
  try{ localStorage.setItem(GTR_KEY, JSON.stringify({at:GTR.lastT, bars})); }catch(e){}
}

function txOpen(t){   // 同 更新台指.py 的 tx_open（台北時間）

function txLiveBars(tf, base){

      const r = days[i].roll && days[i].roll[tf];
      for(const b of txDecode(f.b[tf], tf, pre[i], r ? r.rt : null, post[i])) B.push(b);
      if(r) rolls.push({t:r.rt, out:r.out + pre[i], in:r.in + post[i]});
    });
    TX.rolls[tf] = rolls;
    TX.base[tf] = B;
    // 預設顯示最後兩個交易日（含夜盤）
    const t0 = files.length > 1 ? (txDecode(files[files.length-2].b[tf], tf, 0)[0] || {t:0}).t : 0;
    TX.baseSpan[tf] = Math.max(30, B.filter(b => b.t >= t0).length);
  }
  const LD = days[days.length - 1];
  TX.lastC = LD ? (LD.c2 || LD.c) : ""; TX.upTo = LD ? LD.lt : 0;
  TX.upd = idx.upd; TX.roll = roll; TX.ready = true; TX.err = "";
  txMerge();
}
async function pollHL(p){
  if(!RAW1M[p.sym]) return;
  for(const b of await hlCandles(p.sym, Date.now() - 10 * 60000)) mergeKline(p.sym, b);
  PANELS.forEach(x => { if(x.sym === p.sym) x.dirty = true; });
}
async function loadDon(p, label){
  if(p.src === "yahoo") return loadYahoo(p);
  /* 需要的交易時段分鐘數：回看根數的 3 倍。
     前 look 根不會有任何訊號，而目前的部位可能是好幾週前那次突破建立的——
     只抓「回看＋一點點」的話，會從半路開始算，進場點、停損線都跟 TradingView 對不上
     （v1.0.0 開發時實測：只抓 23 天，那斯達克 6 分錯過 9/18 的進場、黃金錯過 9/02 的翻空）。 */
  const look = Math.round(p.P.lookH * 60 / p.tfMin);
  const needMin = p.needBars ? p.needBars * p.tfMin : look * 3 * p.tfMin;
  await loadKlines(p.sym, needMin, label, !!p.spot, !!p.allDay);
  p.dirty = true;
}
// v1.5.0：現貨（PAXG）不在合約即時連線裡，每 20 秒補最後幾根 1 分 K
async function pollSpot(p){
  if(!RAW1M[p.sym]) return;
  const raw = await jget(`${SAPI}/klines?symbol=${p.sym}&interval=1m&limit=5`);
  for(const k of raw) mergeKline(p.sym, kl(k));
  p.dirty = true;
}
async function main(){
  buildDOM();
  setStatus("", "載入歷史資料中");
  try{
    await Promise.all([
      loadDon(PAN("nq6"), "那斯達克 NQ 期貨"),
      loadDon(PAN("gold8"), "黃金 1 分 K"),
      loadDon(PAN("gold11"), "黃金 PAXG 現貨").catch(e => { $("wait-gold11").textContent = "PAXG 現貨載入失敗：" + e.message + "，請重新整理"; }),
      loadGate(PAN("gate")).catch(e => { $("wait-gate").textContent = "Gate 30 秒 K 載入失敗：" + e.message + "，請重新整理"; }),
      loadGTR().catch(e => { for(const k of ["gate2", "gate3"]) $("wait-" + k).textContent = "Gate 逐筆合成失敗：" + e.message + "，請重新整理"; setLoad("gtr", null); }),
      // C 格 v1.10.0 刪除；Hyperliquid 仍要抓：H 格與交易明細的那斯達克換算要用
      loadHL(PAN("atr1")).catch(e => { $("wait-atr1").textContent = "Hyperliquid 載入失敗：" + e.message + "，請重新整理"; }),
      loadTX().catch(e => { TX.err = "台指資料載入失敗：" + e.message + "，請重新整理"; for(const k of ["tx30", "tx37", "tx22", "o2tx"]) $("wait-" + k).textContent = TX.err; }),
      pollTXL().catch(() => {}),
      pollHSI().catch(e => { HSI.err = "恆生資料讀取失敗：" + e.message; const p = PAN("o2hsi"); if(p) p.dirty = true; }),   // v1.19.0   // 即時 K 拿不到時照舊只顯示盤後資料
      loadDaily().catch(e => { for(const k of ["atr30", "atr1", "atr2"]) $("wait-" + k).textContent = "日線濾網資料載入失敗：" + e.message + "，請重新整理"; }),
    ]);
  }catch(e){
    for(const k of ["nq6", "gold8"]) $("wait-" + k).textContent = "歷史資料載入失敗：" + e.message + "，請重新整理";
    setStatus("err", "載入失敗");
  }
  await updateRatio();
  setInterval(updateRatio, 30000);
  connectWS();
  try{ await load30("QQQUSDT"); dirty30(); updateRatio(); }
  catch(e){ PANELS.filter(p => (p.kind === "rf" || p.kind === "atr") && !p.src && !p.tfMin).forEach(p => { $("wait-" + p.k).textContent = "30 秒線合成失敗：" + e.message + "，請重新整理"; }); setLoad("t30", null); }
  setInterval(save30, 60000);
  // NQ 期貨沒有即時推送，每分鐘向中繼站重抓（中繼站本身也快取 60 秒）
  setInterval(() => { loadYahoo(PAN("nq6")).catch(() => {}); }, 60000);
  setInterval(() => { pollHL(PAN("atr1")).catch(() => {}); }, 15000);
  setInterval(() => { pollGTR().catch(() => {}); }, 10000);
  setInterval(gtrSave, 60000);
  setInterval(() => { loadDaily().catch(() => {}); }, 1800000);
  setInterval(() => { loadTX().catch(() => {}); }, 600000);   // 台指盤後資料：每 10 分鐘看總表有沒有更新
  setInterval(() => { pollHSI().catch(e => { HSI.pollErr = e.message; const p = PAN("o2hsi"); if(p) p.dirty = true; }); }, 30000);   // v1.19.0 恆生
  // v1.18.0：失敗時也重畫台指各格，資料一停警告才跳得出來
  setInterval(() => { pollTXL().catch(e => { TX.pollErr = e.message; PANELS.forEach(p => { if(p.src === "tx") p.dirty = true; }); }); }, 10000);
  mnqRate().catch(() => {}); setInterval(() => { mnqRate().catch(() => {}); }, 3600000);   // v1.13.0 匯率一天更新一次   // v1.12.0 台指即時 K（TradingView 約 15 秒送一批）
  setInterval(() => { pollSpot(PAN("gold11")).catch(() => {}); }, 20000);
  setInterval(() => { pollGate(PAN("gate")).catch(() => {}); }, 10000);
}
// 每秒把有新資料的面板重算重畫；斷線偵測也在這裡
setInterval(() => {
  for(const p of PANELS){
    if(p.dirty){ p.dirty = false; recompute(p); draw(p); }
    renderInfo(p);
  }
  // v1.7.0：交易明細開著時每秒重算（有新翻轉就多一筆）；正式紀錄每 5 分鐘重讀一次
  if(!$("tradeSheet").hidden){ renderTrades(); if(Date.now() - logAt > 300000) loadLog(); }
  if(lastMsg && Date.now() - lastMsg > 20000 && WS && WS.readyState === 1){
    setStatus("warn", "超過 20 秒沒有收到新資料，重新連線");
    lastMsg = Date.now(); try{ WS.close(); }catch(e){}
  }
}, 1000);
// 30 秒線即使沒有新成交，時間到了那根也要收盤
setInterval(() => { if(S30.ready) dirty30(); }, 5000);
window.addEventListener("resize", () => PANELS.forEach(draw));
window.addEventListener("pagehide", save30);
window.APP = {PANELS, S30, RAW1M, get RATIO(){ return RATIO; }};
main();
</script>
